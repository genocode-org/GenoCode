# Deploys the share relay (packages/community/src/relay.ts) to Cloudflare Workers when it changes
# on main, or by hand. Needs the CLOUDFLARE_API_TOKEN secret (a token allowed to edit Workers) and
# the CLOUDFLARE_ACCOUNT_ID variable.
name: Relay

on:
  push:
    branches: [main]
    paths:
      - packages/community/src/relay.ts
      - packages/community/src/share.ts
      - packages/community/wrangler.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          workingDirectory: packages/community
