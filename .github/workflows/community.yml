# Creatures shared from the app arrive as issues labelled `community` (filed by the share relay,
# packages/community/src/relay.ts). This checks each one and comments a picture of it. When a
# maintainer adds the label `approved`, it opens a pull request adding the creature to community/.
#
# The issue's text is untrusted: it reaches the scripts only through environment variables, never
# inside a `run:` line, and the creature's code is only ever run by the GenoCode interpreter, in
# a step that is given no token. Each job has a time limit, as a creature can be slow to build.
name: Community

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: community-${{ github.event.issue.number }}

jobs:
  review:
    # An issue filed with the label sends `labeled` too, so each share is checked once, and
    # adding the label again by hand checks it again.
    if: github.event.action == 'labeled' && github.event.label.name == 'community'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the pictures branch
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prepare -w @genocode/core && npx tsc -b packages/community
      - name: Check the creature
        run: node packages/community/dist/cli.js review "$RUNNER_TEMP/review"
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          PICTURE_URL: https://raw.githubusercontent.com/${{ github.repository }}/community-pictures/${{ github.event.issue.number }}.png
      - name: Put its picture on the pictures branch
        run: |
          cd "$RUNNER_TEMP"
          # A creature that failed its checks has no picture.
          [ -f review/picture.png ] || exit 0
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --quiet --depth 1 --branch community-pictures "$remote" pictures; then
            git init --quiet -b community-pictures pictures
            git -C pictures remote add origin "$remote"
          fi
          cp review/picture.png "pictures/${NUMBER}.png"
          cd pictures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${NUMBER}.png"
          git commit --quiet -m "Picture of the creature in #${NUMBER}"
          # Another share's picture may have been put there meanwhile: add this one after it.
          for try in 1 2 3 4 5; do
            git push --quiet origin community-pictures && exit 0
            sleep $((try * 3))
            git pull --quiet --rebase origin community-pictures
          done
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
      - name: Comment on the issue
        run: gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}

  # Approving is done in two jobs, so the creature's code never runs where the token that can
  # write to the repository is. This one checks the creature again and hands its file on.
  approve-check:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'approved'
      && contains(github.event.issue.labels.*.name, 'community')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      file: ${{ steps.add.outputs.file }}
      text: ${{ steps.add.outputs.text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prepare -w @genocode/core && npx tsc -b packages/community
      - name: Check the creature and write its file
        id: add
        run: |
          file=$(node packages/community/dist/cli.js approve)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "text=$(gzip -c "$file" | base64 -w0)" >> "$GITHUB_OUTPUT"
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}

  # What the first job hands on is only ever written to a file in community/, under a name made
  # of letters, digits and `_`. A maintainer then reads the pull request before merging it.
  approve:
    needs: approve-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add the creature on a new branch and open a pull request
        run: |
          name=$(basename "$FILE" .genie)
          [[ "$FILE" == "community/$name.genie" && "$name" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] || exit 1
          file="community/$name.genie"
          mkdir -p community
          printf '%s' "$TEXT" | base64 -d | gunzip > "$file"
          branch="community/issue-${NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -c "$branch"
          git add "$file"
          git commit --quiet -m "Add $name to the community gallery (#${NUMBER})"
          git push --quiet --force origin "$branch"
          url=$(gh pr create --head "$branch" --base main \
            --title "Add $name to the community gallery" \
            --body "Adds \`$file\`, shared from the app and approved in #${NUMBER}. Closes #${NUMBER}.")
          gh issue comment "$NUMBER" --body "Approved: $url"
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ needs.approve-check.outputs.file }}
          TEXT: ${{ needs.approve-check.outputs.text }}
          NUMBER: ${{ github.event.issue.number }}
