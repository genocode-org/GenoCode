# Publishes the app as a static website on GitHub Pages: it needs no server. Runs on every push to
# main, except when the push only changes files the website isn't built from (listed below). The
# repository's Pages setting must use "GitHub Actions" as its source.
name: Site

on:
  push:
    branches: [main]
    paths-ignore:
      # The phone app.
      - "packages/player/**"
      # The share relay on Cloudflare and the review tool: only share.ts and png.ts are in the site.
      - "packages/community/src/relay.ts"
      - "packages/community/src/review.ts"
      - "packages/community/src/cli.ts"
      - "packages/community/wrangler.toml"
      # Notes for people working on the repo.
      - "**/README.md"
      - "CONTRIBUTING.md"
      - "CLAUDE.md"
      # Logo sources: the site keeps its own copy of the icon in packages/app/public.
      - "branding/**"
      # The script that draws the doc pictures (the pictures themselves are in the site).
      - "docs/pictures.mjs"
      - "**/*.test.ts"
      # The other workflows and GitHub settings.
      - ".github/dependabot.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/community.yml"
      - ".github/workflows/player.yml"
      - ".github/workflows/relay.yml"
      - ".github/workflows/release.yml"
      # Editor and formatting settings.
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one that's waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the sitemap can tell when each page last changed.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only what the website needs: the language reference data, the packages (the site's build
      # loads them from their dist folders), then the app. Not the phone app (packages/player).
      - run: npm run prepare -w @genocode/core && npx tsc -b && npm run build -w @genocode/app
        env:
          GENOCODE_ANALYTICS: "1"
          # Where the app sends creatures shared with the community (packages/community). Until
          # these repository variables are set, the app doesn't offer sharing.
          VITE_SHARE_RELAY: ${{ vars.SHARE_RELAY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
