<!doctype html>
<!--
  Makes the demo tracks in public/demos/. With the player's dev server running
  (npm run player), open /scripts/demos.html, press the button and save each WAV file it gives,
  then turn them into AAC files that every phone plays:
    ffmpeg -i Afterglow.wav -c:a aac -b:a 160k public/demos/Afterglow.m4a
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GenoCode Player demo tracks</title>
  </head>
  <body>
    <button id="make" type="button">Make the demo tracks</button>
    <ul id="files"></ul>
    <script type="module">
      import { DEMOS } from "../src/demos.ts";
      import { render } from "./synth.ts";

      // For scripts driving this page: each demo as a base64 WAV.
      window.makeDemo = async (name) => {
        const file = await render(DEMOS.find((d) => d.name === name));
        const bytes = new Uint8Array(await file.arrayBuffer());
        let text = "";
        for (let i = 0; i < bytes.length; i += 0x8000) {
          text += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
        }
        return btoa(text);
      };

      document.getElementById("make").addEventListener("click", async () => {
        for (const d of DEMOS) {
          const file = await render(d);
          const a = document.createElement("a");
          a.href = URL.createObjectURL(file);
          a.download = file.name;
          a.textContent = file.name;
          const li = document.createElement("li");
          li.append(a);
          document.getElementById("files").append(li);
        }
      });
    </script>
  </body>
</html>
