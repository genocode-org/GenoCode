# The relay that files creatures shared from the app as GitHub issues (src/relay.ts). Deployed by
# .github/workflows/relay.yml. Its two secrets are set once with `npx wrangler secret put`:
# GITHUB_TOKEN (a fine-grained token that may only write issues on the repository below) and
# TURNSTILE_SECRET (the Turnstile widget's secret key).
name = "genocode-share"
main = "src/relay.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
REPO = "genocode-org/GenoCode"
ALLOWED_ORIGINS = "https://genocode.piorek.co.za"

# Five shares a minute from one visitor, after Turnstile has let them through.
[[ratelimits]]
name = "SHARES"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
